<title id="t">Luồng thư viện HIU TMC Hub và StudyOS</title>
<desc id="d">Hub tĩnh tìm metadata và mở PDF bằng canvas. StudyOS xác minh phiên, quyền và trạng thái xuất bản rồi cấp byte từ Drive qua API máy chủ. Định dạng khác mở StudyOS bằng SSO và resourceKey.</desc>
