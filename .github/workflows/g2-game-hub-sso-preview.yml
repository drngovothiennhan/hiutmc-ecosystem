name: G2 Game Hub SSO Preview

on:
  push:
    branches:
      - g2/game-hub-sso-preview
  workflow_dispatch:

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: "1"

concurrency:
  group: g2-game-hub-sso-preview
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package.json

      - name: Install
        run: npm install --no-audit --no-fund

      - name: Validate and build
        run: npm run check

      - name: Require Cloudflare credentials
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CF_TOKEN" || (echo "::error::Missing CLOUDFLARE_API_TOKEN repository secret" && exit 1)
          test -n "$CF_ACCOUNT" || (echo "::error::Missing CLOUDFLARE_ACCOUNT_ID repository secret" && exit 1)

      - name: Create isolated Cloudflare preview
        id: preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          node -e 'const fs=require("fs");const cfg=JSON.parse(fs.readFileSync("wrangler.jsonc","utf8"));cfg.name="hiutmc-ecosystem-g2-sso-preview";cfg.routes=[];cfg.previews={};cfg.workers_dev=true;cfg.preview_urls=true;fs.writeFileSync("wrangler.g2.preview.jsonc",JSON.stringify(cfg,null,2));'
          npx wrangler preview --config wrangler.g2.preview.jsonc --name hiutmc-ecosystem-g2-sso-preview --message "G2 Game Hub preview SSO handoff" --json > preview.json 2>&1
          cat preview.json
          PREVIEW_URL="$(grep -oE 'https://[^"[:space:]]+workers\.dev' preview.json | head -n 1)"
          test -n "$PREVIEW_URL"
          echo "preview_url=$PREVIEW_URL" >> "$GITHUB_OUTPUT"
          echo "### Isolated G2 Ecosystem Preview" >> "$GITHUB_STEP_SUMMARY"
          echo "$PREVIEW_URL" >> "$GITHUB_STEP_SUMMARY"

      - name: Route smoke
        env:
          PREVIEW_URL: ${{ steps.preview.outputs.preview_url }}
        run: |
          for path in / '/?g2-sso-test=1'; do
            code="$(curl -L -sS -o /tmp/body.html -w '%{http_code}' "$PREVIEW_URL$path")"
            test "$code" = "200" || (echo "::error::$path returned $code" && exit 1)
          done

      - name: Install Playwright Chromium
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Responsive and SSO-entry smoke
        env:
          PREVIEW_URL: ${{ steps.preview.outputs.preview_url }}
        run: |
          cat > ./g2-preview-qa.mjs <<'EOF'
          import { chromium } from "playwright";
          import fs from "node:fs";
          const url = process.env.PREVIEW_URL;
          fs.mkdirSync("qa-g2", { recursive: true });
          const browser = await chromium.launch({ headless: true });
          for (const [width, height] of [[390, 844], [768, 1024], [1024, 900]]) {
            const page = await browser.newPage({ viewport: { width, height } });
            await page.goto(`${url}/?g2-sso-test=1`, { waitUntil: "domcontentloaded", timeout: 60000 });
            await page.getByRole("button", { name: "Kiểm tra đăng nhập Game Hub preview" }).waitFor({ state: "visible", timeout: 15000 });
            const metrics = await page.evaluate(() => ({
              scrollWidth: document.documentElement.scrollWidth,
              clientWidth: document.documentElement.clientWidth,
            }));
            if (metrics.scrollWidth > metrics.clientWidth + 1) {
              throw new Error(`horizontal overflow at ${width}px: ${JSON.stringify(metrics)}`);
            }
            await page.screenshot({ path: `qa-g2/home-${width}.png`, fullPage: true });
            await page.close();
          }
          await browser.close();
          EOF
          node ./g2-preview-qa.mjs

      - name: Upload preview screenshots
        uses: actions/upload-artifact@v4
        with:
          name: g2-ecosystem-preview-screenshots
          path: qa-g2
          if-no-files-found: error
          retention-days: 7
