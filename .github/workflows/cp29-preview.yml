name: CP29 Preview QA

on:
  push:
    branches:
      - cp29-approved-home-icons
  workflow_dispatch:

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package.json

      - name: Install
        run: npm install --no-audit --no-fund

      - name: Build and validate
        run: npm run check

      - name: Create isolated Cloudflare Preview
        id: preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          node -e 'const fs=require("fs");const cfg=JSON.parse(fs.readFileSync("wrangler.jsonc","utf8"));cfg.previews={};fs.writeFileSync("wrangler.cp29.preview.jsonc",JSON.stringify(cfg,null,2));'
          set +e
          npx wrangler preview --config wrangler.cp29.preview.jsonc --name cp29-home-icons --message "CP29 approved homepage icon system" --json > preview.json 2>&1
          STATUS=$?
          set -e
          cat preview.json
          test "$STATUS" = "0"
          PREVIEW_URL="$(grep -oE 'https://[^"[:space:]]+workers\.dev' preview.json | head -n 1)"
          test -n "$PREVIEW_URL"
          echo "preview_url=$PREVIEW_URL" >> "$GITHUB_OUTPUT"
          echo "### CP29 Preview" >> "$GITHUB_STEP_SUMMARY"
          echo "$PREVIEW_URL" >> "$GITHUB_STEP_SUMMARY"

      - name: Route smoke
        env:
          PREVIEW_URL: ${{ steps.preview.outputs.preview_url }}
        run: |
          for path in / /learn/ /ai/ /community/ /discover/ /search/ /ecosystem/study-os/ /ecosystem/ai-thiet-chan/ /ecosystem/trung-y-van/ /ecosystem/atlas/; do
            code="$(curl -L -sS -o /tmp/body.html -w '%{http_code}' "$PREVIEW_URL$path")"
            test "$code" = "200" || (echo "::error::$path returned $code" && exit 1)
          done

      - name: Install Playwright Chromium
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Responsive screenshot smoke
        env:
          PREVIEW_URL: ${{ steps.preview.outputs.preview_url }}
        run: |
          cat > ./cp29-qa.mjs <<'EOF'
          import { chromium } from "playwright";
          import fs from "node:fs";
          const url = process.env.PREVIEW_URL;
          const sizes = [
            [360, 800], [390, 844], [412, 915], [430, 932],
            [1024, 900], [1366, 900], [1440, 900],
          ];
          fs.mkdirSync("qa-cp29", { recursive: true });
          const browser = await chromium.launch({ headless: true });
          for (const [width, height] of sizes) {
            const page = await browser.newPage({ viewport: { width, height } });
            await page.goto(url, { waitUntil: "domcontentloaded", timeout: 60000 });
            await page.waitForTimeout(1500);
            const metrics = await page.evaluate(() => ({
              scrollWidth: document.documentElement.scrollWidth,
              clientWidth: document.documentElement.clientWidth,
              dock: Boolean(document.querySelector('nav[aria-label="Điều hướng nhanh trên điện thoại"]')),
              hubCount: document.querySelectorAll('a[href*="study-os"],a[href*="ai-thiet-chan"],a[href*="trung-y-van"],a[href*="atlas"]').length,
            }));
            if (metrics.scrollWidth > metrics.clientWidth + 1) {
              throw new Error(`horizontal overflow at ${width}px: ${JSON.stringify(metrics)}`);
            }
            await page.screenshot({ path: `qa-cp29/home-${width}.png`, fullPage: true });
            await page.close();
          }
          await browser.close();
          EOF
          node ./cp29-qa.mjs

      - name: Upload responsive screenshots
        uses: actions/upload-artifact@v4
        with:
          name: cp29-responsive-screenshots
          path: qa-cp29
          if-no-files-found: error
          retention-days: 14
